<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>離開遊戲</title>
  <link rel="stylesheet" href="exit.css">
</head>
<body>
  <div class="exit-dialog">
    <p class="farewell-text">願林間微光指引你回家的路。</p>
    <p class="sub-text">您可以直接關閉此分頁，或返回選單。</p>
    <div class="btn-group">
      <button class="confirm-btn" onclick="closeGame()">關閉視窗</button>
      <button class="cancel-btn" onclick="cancelExit()">回到遊戲</button>
    </div>
  </div>
  <script src="exit.js"></script>
</body>
</html>
